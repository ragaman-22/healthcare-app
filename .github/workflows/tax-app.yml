# 個人事業主向け税金管理アプリ（tax-app/）の CI。tax-app/ 以下の変更時のみ実行する
name: tax-app

on:
  push:
    paths: ['tax-app/**', '.github/workflows/tax-app.yml']
  pull_request:
    paths: ['tax-app/**', '.github/workflows/tax-app.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: tax-app

jobs:
  check:
    name: Lint・型チェック・単体テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tax-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: DB テスト（マイグレーション・RLS・貸借一致）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu のランナーには PostgreSQL がインストール済み（initdb を使い捨てで起動する）
      - run: bash scripts/test-db.sh

  e2e:
    name: E2E（デモモード・スマートフォン幅）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tax-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tax-app/playwright-report
          retention-days: 7
